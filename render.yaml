services:
  - type: web
    name: sari-ai-demo
    branch: main
    runtime: docker
    dockerContext: ./sari-ai
    dockerfilePath: ./sari-ai/Dockerfile
    healthCheckPath: /api/v1/health
    plan: free
    envVars:
      - key: FREELLMAPI_BASE_URL
        value: https://api.sea-lion.ai/v1
      - key: FREELLMAPI_MODEL
        value: aisingapore/Qwen-SEA-LION-v4.5-27B-IT
      - key: FREELLMAPI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sari-ai-demo-db
          property: connectionString
databases:
  - name: sari-ai-demo-db
    plan: free
