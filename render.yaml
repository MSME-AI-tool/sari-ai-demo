services:
  - type: web
    name: sari-ai-demo
    branch: main
    runtime: docker
    dockerContext: ./sari-ai
    dockerfilePath: ./sari-ai/Dockerfile
    healthCheckPath: /api/v1/health
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sari-ai-demo-db
          property: connectionString
databases:
  - name: sari-ai-demo-db
    plan: free
