services:
  - type: web
    name: sari-ai-demo
    branch: main
    runtime: docker
    dockerContext: ./sari-ai
    dockerfilePath: ./sari-ai/Dockerfile
    healthCheckPath: /api/v1/health
    plan: free
    envVars:
      - key: FREELLMAPI_MODEL
        value: auto
      - key: DATABASE_URL
        fromDatabase:
          name: sari-ai-demo-db
          property: connectionString
databases:
  - name: sari-ai-demo-db
    plan: free
