<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f7" />
    <link rel="preload" href="/fonts/geist-regular.ttf" as="font" type="font/ttf" crossorigin />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('sari-theme') === 'dark' ? 'dark' : 'light';
        if (document.documentElement.dataset.theme === 'dark') {
          document.querySelector('meta[name="theme-color"]').content = '#111326';
        }
      } catch { /* Keep the default theme when storage is unavailable. */ }
    </script>
    <meta name="description" content="Sales, stock, and store insights for small retailers." />
    <link rel="icon" href="/icon-192.png" />
    <title>SARI-AI | Your Store</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
